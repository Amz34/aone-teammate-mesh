<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0844"/>
      <stop offset="100%" stop-color="#FFB199"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="240" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Mesh Grid Accents -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="40" y1="40" x2="760" y2="40"/>
    <line x1="40" y1="120" x2="760" y2="120"/>
    <line x1="40" y1="200" x2="760" y2="200"/>
    <line x1="120" y1="20" x2="120" y2="220"/>
    <line x1="240" y1="20" x2="240" y2="220"/>
    <line x1="680" y1="20" x2="680" y2="220"/>
  </g>

  <!-- Teammate Mesh Emblem (Hexagon Mesh) -->
  <g transform="translate(45, 45)">
    <!-- Outer Glow Polygon -->
    <polygon points="75,10 135,45 135,105 75,140 15,105 15,45" fill="none" stroke="url(#cyanPurple)" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Inner Connections -->
    <line x1="75" y1="10" x2="75" y2="75" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
    <line x1="135" y1="45" x2="75" y2="75" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
    <line x1="135" y1="105" x2="75" y2="75" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
    <line x1="75" y1="140" x2="75" y2="75" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
    <line x1="15" y1="105" x2="75" y2="75" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
    <line x1="15" y1="45" x2="75" y2="75" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>

    <!-- Nodes -->
    <circle cx="75" cy="75" r="9" fill="#00F2FE" filter="url(#glow)"/>
    <circle cx="75" cy="10" r="5" fill="#38bdf8"/>
    <circle cx="135" cy="45" r="5" fill="#818cf8"/>
    <circle cx="135" cy="105" r="5" fill="#38bdf8"/>
    <circle cx="75" cy="140" r="5" fill="#818cf8"/>
    <circle cx="15" cy="105" r="5" fill="#38bdf8"/>
    <circle cx="15" cy="45" r="5" fill="#818cf8"/>
  </g>

  <!-- Typography -->
  <g transform="translate(230, 85)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      AONE <tspan fill="url(#cyanPurple)">TEAMMATE</tspan> MESH
    </text>
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
      Autonomous Persistent AI Coworker Runtime &amp; Orchestration Engine
    </text>
  </g>

  <!-- Badges / Tech Tags -->
  <g transform="translate(230, 160)">
    <!-- Badge 1 -->
    <rect width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="65" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8" font-weight="700">ZERO-TOKEN RUN</text>

    <!-- Badge 2 -->
    <rect x="140" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="205" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#a855f7" font-weight="700">PERSISTENT DB</text>

    <!-- Badge 3 -->
    <rect x="280" width="125" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="342" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#10b981" font-weight="700">P2P HANDOFFS</text>

    <!-- Badge 4 -->
    <rect x="415" width="115" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="472" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#f59e0b" font-weight="700">HITL GATES</text>
  </g>
</svg>
